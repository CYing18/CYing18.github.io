short_bio: >-

  <p>
    I am a first-year Ph.D. student at Columbia University, where I conduct research in the
    <a href="https://labs-laboratory.com/" target="_blank">Laboratory of AI & Biomedical Science (LABS)</a>
    under the supervision of
    <a href="https://scholar.google.com/citations?user=4Wq_FukAAAAJ" target="_blank">Prof. Junhao Wen</a>.
    Prior to joining Columbia, I completed my master's degree at Xiamen University
    under the supervision of
    <a href="https://scholar.google.com/citations?user=Uh1EpKQAAAAJ" target="_blank">Prof. Rongshan Yu</a>.
  </p>
  
  <p>
    My research focuses on developing foundation models and AI agents that integrate multimodal biomedical data to understand human health, disease, and aging.
  </p>



